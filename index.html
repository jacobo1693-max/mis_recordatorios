<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><title>Mis Recordatorios</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#172033}.top{background:#2563eb;color:#fff;padding:22px 18px 34px}.top h1{margin:0;font-size:27px}.top p{margin:5px 0 0;opacity:.9}.wrap{max-width:760px;margin:-18px auto 80px;padding:0 14px}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 5px 22px #1d3a5f18;margin-bottom:14px}.new{width:100%;border:0;background:#16a34a;color:#fff;border-radius:14px;padding:16px;font-size:18px;font-weight:700;cursor:pointer}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;border:0;border-radius:12px;padding:11px;background:#e8edf5;font-weight:650}.tabs .active{background:#dbeafe;color:#1d4ed8}.item{border-left:5px solid #2563eb}.item h3{margin:0 0 5px}.meta{color:#667085;font-size:14px}.badge{display:inline-block;background:#eff6ff;color:#1d4ed8;padding:5px 8px;border-radius:999px;font-size:12px;margin-top:8px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{border:0;padding:8px 11px;border-radius:9px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:20px;max-height:92vh;overflow:auto}.sheet h2{margin-top:0}label{display:block;font-weight:650;margin:13px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}textarea{min-height:70px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks label{font-weight:400;margin:8px 0}.save{width:100%;border:0;background:#2563eb;color:white;padding:14px;border-radius:12px;font-weight:700;margin-top:18px}.cancel{width:100%;border:0;background:transparent;padding:12px}.empty{text-align:center;color:#667085;padding:30px 10px}.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;text-align:center;padding:10px;color:#667085;font-size:12px}
</style></head><body><header class="top"><h1>🔔 Mis Recordatorios</h1><p>Organiza tus pendientes y avisos por WhatsApp</p></header><main class="wrap"><div class="card"><button class="new" onclick="openModal()">＋ Nuevo recordatorio</button></div><div class="tabs"><button class="active" data-tab="proximos">Próximos</button><button data-tab="hoy">Hoy</button><button data-tab="completados">Completados</button></div><div id="list"></div></main><div class="modal" id="modal"><div class="sheet"><h2>Nuevo recordatorio</h2><label>Título</label><input id="title" placeholder="Ej. Llamar al contador"><div class="grid"><div><label>Fecha</label><input id="date" type="date"></div><div><label>Hora</label><input id="time" type="time"></div></div><label>Notas</label><textarea id="notes" placeholder="Información adicional"></textarea><label>Repetir</label><select id="repeat"><option value="no">No repetir</option><option value="diario">Cada día</option><option value="semanal">Cada semana</option><option value="mensual">Cada mes</option><option value="anual">Cada año</option></select><label>Avisarme por WhatsApp</label><div class="checks"><label><input type="checkbox" value="1440"> 1 día antes</label><label><input type="checkbox" value="60"> 1 hora antes</label><label><input type="checkbox" value="15"> 15 minutos antes</label><label><input type="checkbox" value="0" checked> A la hora exacta</label></div><button class="save" onclick="saveReminder()">Guardar recordatorio</button><button class="cancel" onclick="closeModal()">Cancelar</button></div></div><div class="foot">Primera versión • Los recordatorios se guardan en este dispositivo</div><script>
let tab='proximos';let data=JSON.parse(localStorage.getItem('reminders')||'[]');
const $=id=>document.getElementById(id);function openModal(){ $('modal').style.display='flex'; let d=new Date(); d.setDate(d.getDate()+1); $('date').value=d.toISOString().slice(0,10); $('time').value='09:00'}function closeModal(){$('modal').style.display='none'}
function saveReminder(){let title=$('title').value.trim(),date=$('date').value,time=$('time').value;if(!title||!date||!time)return alert('Escribe título, fecha y hora.');let alerts=[...document.querySelectorAll('.checks input:checked')].map(x=>+x.value);data.push({id:Date.now(),title,date,time,notes:$('notes').value.trim(),repeat:$('repeat').value,alerts,done:false});localStorage.setItem('reminders',JSON.stringify(data));$('title').value='';$('notes').value='';closeModal();render()}
function done(id){let r=data.find(x=>x.id===id);r.done=true;localStorage.setItem('reminders',JSON.stringify(data));render()}function del(id){if(confirm('¿Eliminar este recordatorio?')){data=data.filter(x=>x.id!==id);localStorage.setItem('reminders',JSON.stringify(data));render()}}
function render(){let today=new Date().toISOString().slice(0,10);let rows=data.filter(r=>tab==='completados'?r.done:!r.done&&(tab==='hoy'?r.date===today:r.date>=today)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('list').innerHTML=rows.length?rows.map(r=>`<div class="card item"><h3>${esc(r.title)}</h3><div class="meta">📅 ${fmt(r.date)} &nbsp; 🕘 ${r.time}</div>${r.notes?`<div class="meta" style="margin-top:6px">${esc(r.notes)}</div>`:''}<span class="badge">WhatsApp: ${r.alerts.map(a=>a===1440?'1 día antes':a===60?'1 hora antes':a===15?'15 min antes':'hora exacta').join(' · ')}</span>${r.repeat!=='no'?` <span class="badge">↻ ${r.repeat}</span>`:''}<div class="actions">${!r.done?`<button onclick="done(${r.id})">✓ Completar</button>`:''}<button onclick="del(${r.id})">Eliminar</button></div></div>`).join(''):`<div class="card empty">No hay recordatorios aquí.</div>`}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function fmt(d){let [y,m,day]=d.split('-');return `${day}/${m}/${y}`}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelector('.tabs .active').classList.remove('active');b.classList.add('active');tab=b.dataset.tab;render()});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
